<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Soulmate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>💖 Find Your Soulmate</h1>
    <p>Connecting hearts, one match at a time</p>
  </header>

  <div class="card">
    <h2 id="name">Name, Age</h2>
    <p id="details">City | Profession</p>

    <div class="buttons">
      <button class="skip" onclick="nextProfile()">❌ Skip</button>
      <button class="like" onclick="likeProfile()">❤️ Like</button>
      <button class="message onclick="sendMessage()"> Message</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
